<div class="bg-white rounded-xl shadow-md p-6">
  <h2 class="text-xl font-bold text-amber-900 mb-6">Subir Nuevo Producto</h2>

  @if (errorMessage()) {
    <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm">
      {{ errorMessage() }}
    </div>
  }

  @if (!result()) {
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Titulo</label>
        <input type="text" [(ngModel)]="title"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm"
               placeholder="Ej: Tarta de Chocolate Belga" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Descripcion</label>
        <textarea [(ngModel)]="description" rows="3"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm"
                  placeholder="Describe el producto..."></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Imagen del Producto</label>
        <input type="file" accept="image/*" (change)="onFileSelected($event)"
               class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-amber-100 file:text-amber-700 hover:file:bg-amber-200" />
      </div>

      @if (previewUrl()) {
        <div class="mt-4">
          <img [src]="previewUrl()" alt="Preview" class="max-w-sm rounded-lg shadow-md" />
        </div>
      }

      <button (click)="upload()" [disabled]="uploading() || !selectedFile"
              class="bg-amber-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-amber-700 transition-colors disabled:opacity-50">
        {{ uploading() ? 'Analizando con IA...' : 'Subir y Analizar' }}
      </button>
    </div>
  }

  @if (result()) {
    <div class="space-y-6">
      <div class="bg-green-50 border border-green-200 rounded-xl p-6">
        <div class="flex items-center gap-2 mb-3">
          <span class="text-2xl">🤖</span>
          <h3 class="text-lg font-semibold text-green-800">Hashtags generados por IA</h3>
        </div>
        <div class="flex flex-wrap gap-2 mb-4">
          @for (tag of result()!.hashtags; track tag) {
            <span class="bg-green-200 text-green-900 px-3 py-1 rounded-full text-sm font-medium">{{ tag }}</span>
          }
        </div>
        <img [src]="'http://localhost:8080' + result()!.imageUrl"
             alt="Producto subido" class="max-w-sm rounded-lg shadow-md" />
      </div>

      <button (click)="reset()"
              class="bg-amber-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-amber-700 transition-colors">
        Subir Otro Producto
      </button>
    </div>
  }
</div>

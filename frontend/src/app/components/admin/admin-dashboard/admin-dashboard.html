<div class="container mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold text-amber-900 mb-6">Panel de Administracion</h1>

  <div class="flex gap-6">
    <nav class="w-56 bg-white rounded-xl shadow-md p-4 h-fit">
      <ul class="space-y-1">
        <li>
          <a routerLink="/admin/products/upload" routerLinkActive="bg-amber-100 text-amber-900 font-semibold"
             class="block px-4 py-2 rounded-lg hover:bg-amber-50 transition-colors text-sm">
            Subir Producto
          </a>
        </li>
        <li>
          <a routerLink="/admin/inventory" routerLinkActive="bg-amber-100 text-amber-900 font-semibold"
             class="block px-4 py-2 rounded-lg hover:bg-amber-50 transition-colors text-sm">
            Inventario y Recetas
          </a>
        </li>
        <li>
          <a routerLink="/admin/orders" routerLinkActive="bg-amber-100 text-amber-900 font-semibold"
             class="block px-4 py-2 rounded-lg hover:bg-amber-50 transition-colors text-sm">
            Pedidos
          </a>
        </li>
      </ul>
    </nav>

    <div class="flex-1">
      <router-outlet />
      @if (!showChildRoute()) {
        <div class="bg-white rounded-xl shadow-md p-8 text-center">
          <div class="text-5xl mb-4">🍰</div>
          <h2 class="text-xl font-semibold text-amber-900 mb-2">Bienvenido al Panel de Administracion</h2>
          <p class="text-gray-500 text-sm">Selecciona una opcion del menu lateral para empezar</p>
        </div>
      }
    </div>
  </div>
</div>

<div style="font-family:'Lato',Arial,sans-serif;">
  <a routerLink="/admin/dashboard" class="btn-back">&larr; Volver al Dashboard</a>

  <!-- Header -->
  <div class="card" style="padding:16px 20px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between;">
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="icon-box">&#128221;</div>
      <h2 class="card-title">Gestion de Recetas</h2>
    </div>
    <button (click)="newItem()" class="btn-green">+ Nueva</button>
  </div>

  <!-- Formulario -->
  <div class="card" style="padding:16px 20px; margin-bottom:12px;">
    <div class="form-header">
      <div class="form-dot" [style.background]="isNewItem() ? '#22C55E' : '#C8A96E'"></div>
      <h3 class="form-title">{{ isNewItem() ? 'Nueva Receta' : 'Editar: ' + formItem.name }}</h3>
    </div>

    <div class="form-row">
      <div class="field field-lg"><label>Nombre *</label><input type="text" [(ngModel)]="formItem.name" placeholder="Nombre de la receta" class="input" /></div>
    </div>
    <div class="form-row">
      <div class="field" style="flex:1;"><label>Instrucciones</label><textarea [(ngModel)]="formItem.instructions" rows="2" placeholder="Instrucciones de preparacion..." class="input" style="resize:vertical;"></textarea></div>
    </div>

    <div class="form-actions">
      <button (click)="saveItem()" class="btn-green">{{ isNewItem() ? 'Crear' : 'Guardar' }}</button>
      @if (!isNewItem()) { <button (click)="deleteItem(formItem.id!)" class="btn-red">Eliminar</button> }
      <button (click)="newItem()" class="btn-gray">Limpiar</button>
    </div>
  </div>

  <!-- Lista -->
  <div class="card" style="padding:16px 20px;">
    @for (recipe of items(); track recipe.id) {
      <div style="border:1px solid #E0D5C5; border-radius:8px; padding:12px; margin-bottom:8px; cursor:pointer; transition:all 0.2s;" [style.background]="formItem.id === recipe.id ? '#FEF3C7' : 'white'" (click)="selectItem(recipe)" onmouseover="if(!this.style.background.includes('254'))this.style.background='#F5F0EB'" onmouseout="if(!this.style.background.includes('254'))this.style.background='white'">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3 style="font-family:'Playfair Display',Georgia,serif; font-size:14px; font-weight:700; color:#3E2723;">{{ recipe.name }}</h3>
          <div>
            <button (click)="$event.stopPropagation(); selectItem(recipe)" class="btn-xs btn-blue">Editar</button>
            <button (click)="$event.stopPropagation(); deleteItem(recipe.id!)" class="btn-xs btn-red-outline">Borrar</button>
          </div>
        </div>
        <p style="font-size:11px; color:#8B7355; margin-top:4px; line-height:1.5; white-space:pre-line;">{{ recipe.instructions }}</p>
      </div>
    }
    @if (items().length === 0 && !loading()) { <p class="empty-msg">No hay recetas registradas</p> }
  </div>
</div>

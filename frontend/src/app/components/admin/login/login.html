<div style="min-height:80vh; display:flex; align-items:center; justify-content:center; background:#F0E6D6; padding:24px; font-family:'Lato',Arial,sans-serif;">
  <div style="background:white; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,0.1); padding:48px; width:100%; max-width:420px;">
    <!-- Logo -->
    <div style="text-align:center; margin-bottom:36px;">
      <div style="width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg,#C8A96E,#B8954A); display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 16px;">&#127856;</div>
      <h1 style="font-family:'Playfair Display',Georgia,serif; font-size:24px; font-weight:700; color:#3E2723; margin-bottom:6px;">Acceso Administrador</h1>
      <p style="font-size:13px; color:#8B7355;">Panel de gestión de Belieta</p>
    </div>

    @if (errorMessage()) {
      <div style="background:#FEF2F2; border:1px solid #FECACA; color:#B91C1C; padding:12px 16px; border-radius:8px; margin-bottom:20px; font-size:13px;">
        {{ errorMessage() }}
      </div>
    }

    <div style="display:flex; flex-direction:column; gap:20px;">
      <div>
        <label style="display:block; font-size:12px; font-weight:600; color:#3E2723; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.05em;">Usuario</label>
        <input type="text" [(ngModel)]="username" (keyup.enter)="login()"
               style="width:100%; padding:12px 16px; border:2px solid #E0D5C5; border-radius:8px; font-size:14px; outline:none; font-family:'Lato',Arial,sans-serif; color:#3E2723; box-sizing:border-box;"
               placeholder="Tu usuario"
               onfocus="this.style.borderColor='#C8A96E'" onblur="this.style.borderColor='#E0D5C5'" />
      </div>

      <div>
        <label style="display:block; font-size:12px; font-weight:600; color:#3E2723; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.05em;">Contrasena</label>
        <input type="password" [(ngModel)]="password" (keyup.enter)="login()"
               style="width:100%; padding:12px 16px; border:2px solid #E0D5C5; border-radius:8px; font-size:14px; outline:none; font-family:'Lato',Arial,sans-serif; color:#3E2723; box-sizing:border-box;"
               placeholder="Tu contraseña"
               onfocus="this.style.borderColor='#C8A96E'" onblur="this.style.borderColor='#E0D5C5'" />
      </div>

      <button (click)="login()" [disabled]="loading()"
              style="width:100%; padding:14px; border:none; border-radius:8px; background:linear-gradient(135deg,#C8A96E,#B8954A); color:white; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; cursor:pointer; font-family:'Lato',Arial,sans-serif; transition:opacity 0.3s;"
              [style.opacity]="loading() ? '0.6' : '1'">
        {{ loading() ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
      </button>
    </div>

    <div style="text-align:center; margin-top:24px;">
      <a href="/" style="font-size:12px; color:#8B7355; text-decoration:none;">&larr; Volver al inicio</a>
    </div>
  </div>
</div>

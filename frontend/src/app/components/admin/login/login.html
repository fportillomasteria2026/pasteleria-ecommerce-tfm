<div class="min-h-[80vh] flex items-center justify-center">
  <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-amber-900 mb-2">Acceso Administrador</h1>
      <p class="text-gray-500 text-sm">Panel de gestion de Pasteleria Dulce Arte</p>
    </div>

    @if (errorMessage()) {
      <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm">
        {{ errorMessage() }}
      </div>
    }

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
        <input type="text" [(ngModel)]="username" (keyup.enter)="login()"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500"
               placeholder="admin" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Contrasena</label>
        <input type="password" [(ngModel)]="password" (keyup.enter)="login()"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500"
               placeholder="admin" />
      </div>

      <button (click)="login()" [disabled]="loading()"
              class="w-full bg-amber-600 text-white py-2 rounded-lg font-semibold hover:bg-amber-700 transition-colors disabled:opacity-50">
        {{ loading() ? 'Iniciando sesion...' : 'Iniciar Sesion' }}
      </button>
    </div>
  </div>
</div>

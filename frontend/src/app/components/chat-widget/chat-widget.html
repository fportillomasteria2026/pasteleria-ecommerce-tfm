<!-- Chat Toggle Button -->
<div class="chat-toggle" (click)="toggle()">
  @if (!isOpen()) {
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  } @else {
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  }
</div>

<!-- Chat Window -->
@if (isOpen()) {
  <div class="chat-window">
    <!-- Header -->
    <div class="chat-header">
      <div class="chat-header-info">
        <div class="chat-avatar">B</div>
        <div>
          <div class="chat-name">Dulce Sabor</div>
          <div class="chat-status">Asistente Virtual</div>
        </div>
      </div>
      <button class="chat-close" (click)="toggle()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Messages -->
    <div class="chat-messages">
      @for (msg of messages(); track $index) {
        <div class="chat-msg" [class.user]="msg.isUser" [class.bot]="!msg.isUser">
          <div class="chat-bubble" [class.order-bubble]="msg.isOrder">{{ msg.text }}</div>
          <div class="chat-time">{{ msg.time }}</div>
          @if (msg.isOrder) {
            <button class="whatsapp-btn" (click)="openWhatsApp()">Enviar por WhatsApp</button>
          }
        </div>
      }
      @if (isLoading()) {
        <div class="chat-msg bot">
          <div class="chat-bubble typing">
            <span></span><span></span><span></span>
          </div>
        </div>
      }
    </div>

    <!-- Quick Actions -->
    @if (!showOrderForm()) {
      <div class="quick-actions">
        <button class="quick-btn" (click)="userInput='Que tartas teneis?'; send()">Ver tartas</button>
        <button class="quick-btn" (click)="userInput='Cuales son vuestros horarios?'; send()">Horarios</button>
        <button class="quick-btn order-btn" (click)="openOrderForm()">Hacer pedido</button>
      </div>
    }

    <!-- Order Form -->
    @if (showOrderForm()) {
      <div class="order-form">
        <div class="order-form-header">
          <span>Nuevo Pedido</span>
          <button class="order-close" (click)="closeOrderForm()">&times;</button>
        </div>
        <input type="text" [(ngModel)]="orderForm.cliente" placeholder="Tu nombre" class="order-input" />
        <input type="text" [(ngModel)]="orderForm.tartaNombre" placeholder="Nombre de la tarta" class="order-input" />
        <select [(ngModel)]="orderForm.tamano" class="order-input">
          @for (t of tamanos; track t) { <option [value]="t">Tamano {{ t }}</option> }
        </select>
        <input type="text" [(ngModel)]="orderForm.personalizacion" placeholder="Personalizacion (opcional)" class="order-input" />
        <input type="number" [(ngModel)]="orderForm.precio" step="0.01" placeholder="Precio EUR (opcional)" class="order-input" />
        <input type="text" [(ngModel)]="orderForm.notas" placeholder="Notas adicionales (opcional)" class="order-input" />
        <button class="submit-order-btn" (click)="submitOrder()" [disabled]="!orderForm.tartaNombre.trim()">Confirmar Pedido</button>
      </div>
    }

    <!-- Input -->
    <div class="chat-input-wrap">
      <input type="text" [(ngModel)]="userInput" (keyup.enter)="send()" placeholder="Escribe tu pregunta..." class="chat-input" />
      <button class="chat-send" (click)="send()" [disabled]="!userInput.trim() || isLoading()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
}

spring.application.name=prompt-maestro-backend
server.port=8080

# H2 con archivo persistente
spring.datasource.url=jdbc:h2:file:/opt/render/project/data/promptmaestro;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Supabase REST API (solo para materia_prima)
supabase.url=${SUPABASE_URL:https://db.jzdyzdevcydamitjcipz.supabase.co}
supabase.anon-key=${SUPABASE_ANON_KEY:}

# Desactivar Vertex AI
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.vertexai.gemini.VertexAiGeminiAutoConfiguration

jwt.secret=${JWT_SECRET:PromptMaestroTFM2026SecureJWTKey32Bytes!!}
jwt.expiration-ms=86400000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

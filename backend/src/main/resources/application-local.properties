spring.application.name=prompt-maestro-backend
server.port=8080

# H2 Database for local development
spring.datasource.url=jdbc:h2:mem:promptmaestro
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable Vertex AI autoconfiguration for local development
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.vertexai.gemini.VertexAiGeminiAutoConfiguration

jwt.secret=${JWT_SECRET:local-dev-secret-key-for-testing-only-32bytes!}
jwt.expiration-ms=86400000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.web.resources.static-locations=classpath:/static/,file:uploads/
